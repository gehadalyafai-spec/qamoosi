name: Flutter checks
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main, development]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,web .
      - name: Resolve packages
        run: flutter pub get
      - name: Generate Android and Web launcher icons
        run: dart run flutter_launcher_icons
      - name: Verify launcher icon outputs
        run: |
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s web/icons/Icon-192.png
          test -s web/icons/Icon-512.png
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
