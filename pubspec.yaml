name: qamoosi
description: Arabic-first offline educational flashcards starter
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.5
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

# Launcher icons are generated from the exact high-resolution Qamoosi artwork.
# Android/web platform directories are generated locally, not kept in Git.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/qamoosi_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#101D32"
  adaptive_icon_foreground: "assets/branding/qamoosi_icon.png"
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: "assets/branding/qamoosi_icon.png"
    background_color: "#101D32"
    theme_color: "#101D32"
